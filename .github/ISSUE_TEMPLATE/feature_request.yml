name: Feature request
description: A check, tool or integration you want
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out about your CRM?
      description: The question, not the solution. "Which accounts have no owner and an open deal" is better than "add a filter".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you answer it today?
  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool, argument or check
  - type: checkboxes
    id: constraints
    attributes:
      label: This project's constraints
      options:
        - label: It needs no write access to the CRM
        - label: It needs no new runtime dependency
        - label: It can be computed deterministically, without a model
