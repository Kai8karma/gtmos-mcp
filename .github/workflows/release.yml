name: Release

# Push a tag like v0.6.0 to publish. The tag must match the version in
# pyproject.toml, gtmos/__init__.py, server.json and the plugin manifest, or
# the run stops before anything is uploaded.
#
# One-time setup:
#   1. PyPI -> gtmos-mcp -> Publishing -> add a trusted publisher for this
#      repository, workflow "release.yml", environment "pypi".
#   2. GitHub -> Settings -> Environments -> create "pypi" (add yourself as a
#      required reviewer if you want a manual gate before upload).
# The MCP Registry step needs no secret: it authenticates with GitHub OIDC,
# which proves the io.github.Kai8karma/* namespace.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" twine
      - name: Tag matches every version field
        run: python scripts/check_versions.py --tag "${GITHUB_REF_NAME}"
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # GitHub OIDC login to the MCP Registry
      contents: read
    env:
      # Pinned on purpose. Raise it deliberately; do not point at releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - name: Wait for the new version to be visible on PyPI
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "https://pypi.org/pypi/gtmos-mcp/${version}/json"; then
              echo "gtmos-mcp ${version} is on PyPI"; exit 0
            fi
            echo "not visible yet (attempt ${attempt}/30)"; sleep 10
          done
          echo "gtmos-mcp ${version} never appeared on PyPI" >&2; exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
