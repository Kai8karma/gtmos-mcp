name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: The package still has zero runtime dependencies
        run: |
          python - <<'PY'
          import tomllib, sys
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          sys.exit(f"runtime dependencies crept in: {deps}" if deps else 0)
          PY
      - name: Versions agree (pyproject, package, server.json, plugin)
        run: python scripts/check_versions.py
      - name: CLI smoke
        run: gtmos mcp --dry-run

  interop:
    name: interop (official MCP client)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[interop]"
      - name: Drive the server with the official SDK client, modern and legacy
        run: python scripts/interop_check.py

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/gtmos mcp --dry-run
