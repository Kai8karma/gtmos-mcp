[project]
name = "gtmos-mcp"
version = "0.6.0"
description = "Read-only CRM audit for Claude over MCP: score data integrity, find duplicate clusters and stalled revenue, in your environment through your own token."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kai (Kai8karma)" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["mcp", "model-context-protocol", "crm", "hubspot", "audit", "claude"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# The package itself has no runtime dependencies. These are for working on it.
dev = ["pytest>=8", "ruff==0.17.5", "build>=1.2"]
# Only for scripts/interop_check.py, which drives the server with the official client.
interop = ["mcp>=2,<3"]

[project.urls]
Homepage = "https://kai8karma.github.io/agentkai/"
Repository = "https://github.com/Kai8karma/gtmos-mcp"
Changelog = "https://github.com/Kai8karma/gtmos-mcp/blob/master/CHANGELOG.md"
Issues = "https://github.com/Kai8karma/gtmos-mcp/issues"

[project.scripts]
gtmos = "gtmos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gtmos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# Gate on real defects (syntax errors, undefined names, unused imports), not style.
select = ["E9", "F"]
